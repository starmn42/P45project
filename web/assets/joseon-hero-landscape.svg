  <g fill="#1b3128" opacity="0.58">
    <path d="M1207 169 C1195 124 1206 98 1223 74 C1212 118 1219 150 1230 178Z"/>
    <path d="M1198 90 C1165 95 1145 82 1130 65 C1155 74 1176 73 1204 59 C1190 77 1187 82 1198 90Z"/>
