    <path d="M0 31 H130 L106 18 H24 Z"/>
    <path d="M20 31 H110 V84 H20 Z"/>
    <path d="M29 37 H101 V79 H29 Z" fill="#efe3cd" opacity="0.15"/>
    <path d="M7 86 H123 V92 H7 Z"/>
    <path d="M35 31 V87 H29 V31 Z M101 31 V87 H95 V31 Z"/>
    <path d="M-10 29 L64 0 L138 29 L106 23 L64 10 L22 23 Z"/>
