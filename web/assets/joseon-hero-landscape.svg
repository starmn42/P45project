<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray"><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <linearGradient id="inkLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11201f" stop-opacity="1"/>
      <stop offset="0.68" stop-color="#243531" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#243531" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7468" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#2a3c36" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#efdca9" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#efdca9" stop-opacity="0.18"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="260" fill="#efe3cd"/>
  <rect width="1600" height="260" fill="#80684a" filter="url(#paper)" opacity="0.42"/>

  <!-- left bold ink wash -->
  <path d="M0,26 C170,-5 332,6 480,56 C434,85 440,118 508,150 C404,144 264,176 188,223 C148,246 96,257 0,260 Z" fill="url(#inkLeft)"/>
  <path d="M0,88 C137,45 286,76 412,114 C295,125 207,164 120,233 L0,260 Z" fill="#101d1d" opacity="0.36"/>
  <path d="M0,126 C88,111 172,119 258,149 C201,168 140,203 74,248 L0,260 Z" fill="#20312e" opacity="0.18"/>

  <!-- center and right mountains -->
  <path d="M450 195 C514 149 569 154 628 110 C678 72 742 71 783 118 C831 84 898 91 940 132 C1008 97 1070 71 1121 102 C1161 67 1246 61 1307 121 C1368 181 1457 155 1600 114 L1600 260 L450 260 Z" fill="url(#mist)"/>
  <path d="M560 217 C651 174 717 181 795 139 C877 95 967 93 1054 150 C1116 192 1189 178 1267 133 C1332 97 1431 109 1600 172 L1600 260 L560 260 Z" fill="#33453f" opacity="0.22"/>
  <path d="M832 228 C929 208 998 196 1085 153 C1182 105 1301 127 1600 208 L1600 260 L832 260 Z" fill="#5b7064" opacity="0.14"/>

  <!-- moon and pavilion -->
