  <g fill="#f7eee0" stroke="#a85d4d" stroke-width="1" opacity="0.75">
    <circle cx="83" cy="55" r="6"/><circle cx="112" cy="49" r="5"/><circle cx="127" cy="67" r="6"/>
  </g>

  <!-- subtle paper frame lines -->
  <rect x="8" y="8" width="1584" height="244" fill="none" stroke="#c8b080" stroke-opacity="0.24"/>
  <path d="M0 240 C248 229 402 250 611 240 C841 230 1012 251 1240 240 C1397 232 1500 236 1600 231" stroke="#bda878" stroke-width="1" opacity="0.3" fill="none"/>
