name: P45 Auto Lifecycle

on:
  schedule:
    # Saturday KST: 22:00, 22:30, 23:00, 23:30 (UTC: 13:00, 13:30, 14:00, 14:30)
    - cron: '0 13 * * 6'
    - cron: '30 13 * * 6'
    - cron: '0 14 * * 6'
    - cron: '30 14 * * 6'
    # Sunday KST: 09:00 (UTC: 00:00)
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: p45-auto-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute authoritative P45 auto lifecycle
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m p45_v27.webapp --once --trigger-source github_actions
