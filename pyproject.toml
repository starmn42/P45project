[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p45-research-engine"
version = "0.1.0"
description = "P45 Research Engine data foundation"
requires-python = ">=3.10"

[project.scripts]
p45 = "p45.cli:main"
p45-web = "p45.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]
